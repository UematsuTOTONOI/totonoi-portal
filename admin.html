<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTONOI 管理者ダッシュボード</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--green:#2a6b55;--green-lt:#e8f5ee;--green-md:#c5e8d5;--green-dk:#1a4a3a;--orange:#e85d04;--amber:#f5a623;--bg:#f5f3ef;--white:#fff;--text:#1a1a1a;--text2:#555;--text3:#999;--border:#e0ddd8;--radius:10px;--radius-sm:6px;}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:36px 28px;width:320px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.login-logo{font-size:20px;font-weight:700;color:var(--green);}
.login-sub{font-size:12px;color:var(--text3);margin:4px 0 24px;}
.login-box input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:12px;}
.login-box button{width:100%;padding:11px;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;}
.login-box button:disabled{opacity:0.6;cursor:default;}
.login-err{font-size:11px;color:#c0392b;margin-top:8px;display:none;}
.topbar{background:var(--green);color:white;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar b{font-size:14px;letter-spacing:0.04em;}
.topbar span{opacity:0.7;font-size:11px;margin-left:8px;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.filter-bar label{font-size:11px;color:var(--text3);}
.filter-bar input,.filter-bar select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;}
.filter-bar button{padding:6px 14px;border-radius:99px;border:1px solid var(--green);background:var(--green);color:white;font-size:12px;cursor:pointer;}
.filter-bar.staff-row{margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 6px;text-align:center;}
.stat-n{font-size:20px;font-weight:600;color:var(--green);}
.stat-l{font-size:9px;color:var(--text3);margin-top:2px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;overflow-x:auto;}
.card h2{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px;}
th{background:var(--bg);color:var(--text3);font-size:10px;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top;}
tr:hover td{background:var(--green-lt);}
.rate-bar-bg{width:70px;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.rate-bar-fill{height:100%;background:var(--green);}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;background:var(--green-lt);color:var(--green);white-space:nowrap;}
.conv-cell{max-width:260px;white-space:pre-wrap;font-size:11px;color:var(--text);}
.loading{text-align:center;padding:30px;color:var(--text3);font-size:13px;}
.empty{color:var(--text3);font-size:12px;padding:16px 0;text-align:center;}
.staff-row-item{cursor:pointer;}
.staff-row-item.active td{background:var(--green-lt);}
.staff-row-item td:first-child{font-weight:600;}
.clear-staff-btn{font-size:10px;color:var(--text3);text-decoration:underline;cursor:pointer;margin-left:8px;}
.cal-header{display:flex;align-items:center;justify-content:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:10px;}
.cal-nav{background:var(--bg);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;color:var(--text2);}
.cal-nav:hover{background:var(--green-lt);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--text3);margin-bottom:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{min-height:82px;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--text3);padding:4px 2px;}
.cal-cell.has-data{cursor:pointer;background:var(--green-lt);border-color:var(--green-md);color:var(--text);}
.cal-cell.has-data:hover{background:var(--green-md);}
.cal-cell.selected{background:var(--green)!important;border-color:var(--green)!important;color:white!important;}
.cal-day{font-weight:700;font-size:18px;margin-bottom:2px;}
.cal-stats{font-size:9px;line-height:1.5;text-align:center;white-space:nowrap;}
@media(max-width:640px){
  .wrap{padding:14px 10px 40px;}
  .filter-bar{padding:8px 10px;}
  .stat-grid{gap:6px;margin-bottom:14px;}
  .stat{padding:10px 4px;}
  .stat-n{font-size:16px;}
  .stat-l{font-size:8px;}
  .card{padding:12px;}
  .cal-cell{min-height:66px;padding:2px 1px;}
  .cal-day{font-size:14px;}
  .cal-stats{font-size:8px;}
  table{min-width:520px;}
}
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">TOTONOI</div>
    <div class="login-sub">管理者ダッシュボード</div>
    <input type="password" id="loginPass" placeholder="管理者パスワード" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="loginErr">パスワードが違います</div>
  </div>
</div>

<div id="dashWrap" style="display:none;">
  <div class="topbar"><div><b>TOTONOI</b><span>管理者ダッシュボード</span></div></div>
  <div class="wrap">

    <div class="filter-bar">
      <label>日付</label>
      <input type="date" id="f-date" onchange="applyFilter()">
      <button onclick="applyFilter()">絞り込む</button>
      <button onclick="resetFilter()" style="background:var(--white);color:var(--text2);border-color:var(--border);">TOPへ</button>
    </div>
    <div class="filter-bar staff-row">
      <label>担当者</label>
      <select id="f-staff" onchange="applyFilter()"><option value="">全員</option></select>
    </div>

    <div id="personal-detail"></div>

    <div id="overview-area">
      <div class="stat-grid">
        <div class="stat"><div class="stat-n" id="st-count">-</div><div class="stat-l">日報件数</div></div>
        <div class="stat"><div class="stat-n" id="st-avg">-</div><div class="stat-l">平均完了率</div></div>
        <div class="stat"><div class="stat-n" id="st-staff">-</div><div class="stat-l">対象人数</div></div>
      </div>

      <div class="card">
        <h2>担当者別 完了率サマリー</h2>
        <div id="staff-table"><div class="loading">読み込み中...</div></div>
      </div>
    </div>

    <div class="card">
      <h2>お客様対応ログ（会話・満足度）</h2>
      <div id="customer-table"><div class="loading">読み込み中...</div></div>
    </div>

    <div class="card">
      <h2>通常業務以外の業務ログ（施設改善・任務タスクなど）</h2>
      <div id="extra-table"><div class="loading">読み込み中...</div></div>
    </div>

    <div class="card">
      <h2>日報一覧</h2>
      <div id="report-table"><div class="loading">読み込み中...</div></div>
    </div>

  </div>
</div>

<script>
// 既存ポータルと同じGAS URL
const GAS_URL = "https://script.google.com/macros/s/AKfycbx55qhEqhaXZPMKIuSEhjmTBqprKlJFENmfygkBa2uMOjZ7BzsYkY3QCmxW0UsrVJ-_/exec";

let allReports = [];

function getDefaultDate() {
  const d = new Date();
  d.setDate(d.getDate() - 1); // 前日をデフォルト表示にする
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

window.doLogin = async function () {
  const pass = document.getElementById("loginPass").value;
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  btn.disabled = true; btn.textContent = "確認中...";
  try {
    const res = await fetch(`${GAS_URL}?pw=${encodeURIComponent(pass)}`);
    const json = await res.json();
    if (json.status !== "ok") {
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "ログイン";
      return;
    }
    allReports = dedupeReports(json.reports || []);
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("dashWrap").style.display = "block";
    document.getElementById("f-date").value = getDefaultDate();
    populateStaffFilter();
    applyFilter();
  } catch (e) {
    errEl.textContent = "通信エラー：" + e.message;
    errEl.style.display = "block";
    btn.disabled = false; btn.textContent = "ログイン";
  }
};

// 担当者の表示順・対象を固定（テスト用の名前などは表示しない）
const STAFF_ORDER = ['梶原', '保乃圭', '阿部', '稜奈', '璃胡', '里吉'];

function populateStaffFilter() {
  const sel = document.getElementById("f-staff");
  sel.innerHTML = '<option value="">全員</option>' + STAFF_ORDER.map(s => `<option>${s}</option>`).join("");
}

window.applyFilter = function () {
  const date = document.getElementById("f-date").value;
  const staff = document.getElementById("f-staff").value;
  let filtered = allReports;
  if (date) filtered = filtered.filter(r => workDateStr(r) === date);
  if (staff) filtered = filtered.filter(r => r['担当者'] === staff);
  render(filtered, { staff, date });
};

window.resetFilter = function () {
  document.getElementById("f-date").value = getDefaultDate();
  document.getElementById("f-staff").value = "";
  applyFilter();
};

// 担当者別サマリーの行をクリックすると、その担当者だけに絞り込む
window.selectStaff = function (name) {
  document.getElementById("f-staff").value = name;
  applyFilter();
};

// カレンダーの日付をクリックすると、その日1日だけに絞り込む
window.selectDay = function (date) {
  document.getElementById("f-date").value = date;
  applyFilter();
};
window.clearDay = function () {
  document.getElementById("f-date").value = "";
  applyFilter();
};

// カレンダーの表示中の年月（担当者選択中のみ使用）
let calMonth = null;
window.changeCalMonth = function (delta) {
  if (!calMonth) return;
  let m = calMonth.month + delta, y = calMonth.year;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  calMonth = { year: y, month: m };
  applyFilter();
};

function buildCalendarHtml(byDate, selectedDate) {
  const { year, month } = calMonth;
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const info = byDate[dateStr];
    const hasData = !!info;
    const isSelected = dateStr === selectedDate;
    cells += `<div class="cal-cell${hasData ? ' has-data' : ''}${isSelected ? ' selected' : ''}"${hasData ? ` onclick="selectDay('${dateStr}')"` : ''}>
      <div class="cal-day">${day}</div>
      ${hasData ? `<div class="cal-stats">✓${info.avg}%<br>💬${info.talk}<br>🔧${info.extra}</div>` : ''}
    </div>`;
  }
  return `
    <div class="cal-header">
      <button class="cal-nav" onclick="changeCalMonth(-1)">‹</button>
      <span>${year}年${month + 1}月</span>
      <button class="cal-nav" onclick="changeCalMonth(1)">›</button>
    </div>
    <div class="cal-weekdays">${['日', '月', '火', '水', '木', '金', '土'].map(w => `<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}

// スプレッドシートの日付セルは自動的にJSTのDateとして保存され、GAS側でJSON化される際に
// UTC文字列（例: "2026-08-14T15:00:00.000Z"）に変換される。そのまま先頭10文字を取ると
// 実際の勤務日から1日ズレることがあるため、+9時間してJSTに戻してから日付を取り出す。
function workDateStr(r) {
  const v = r['勤務日'];
  let d;
  if (v instanceof Date) {
    d = v;
  } else {
    const s = String(v || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; // すでに日付のみの文字列ならそのまま
    const parsed = new Date(s);
    if (isNaN(parsed)) return s;
    d = parsed;
  }
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}

// 完了率：スプレッドシート側で "95%" という文字列が自動的に
// パーセント数値（0.95など）に変換されているケースの両方に対応
function rateNum(r) {
  const v = r['完了率'];
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') {
    return Math.round(v <= 1 ? v * 100 : v);
  }
  const s = String(v).trim();
  const n = parseFloat(s.replace('%', ''));
  if (isNaN(n)) return 0;
  return Math.round(!s.includes('%') && n <= 1 ? n * 100 : n);
}
function formatRate(r) { return rateNum(r) + '%'; }

// シフト表示名：「中番（現場）」は「現場」だけで表示する（他はそのまま）
function formatShift(s) {
  if (s === '中番（現場）') return '現場';
  return s || '-';
}

// 送信日時をDateとしてパース（Dateオブジェクト／"yyyy/MM/dd HH:mm:ss"文字列の両対応）
function parseSentAt(r) {
  const v = r['送信日時'];
  if (v instanceof Date) return v;
  const s = String(v || '').trim();
  const m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  const d = new Date(s);
  return isNaN(d) ? new Date(0) : d;
}

// カンマ区切り／改行区切りの文字列を配列に分割する共通処理
function splitComma(s) { return String(s || '').split(',').map(x => x.trim()).filter(x => x !== ''); }
function splitLinesStr(s) { return String(s || '').split('\n').map(x => x.trim()).filter(x => x !== ''); }

// 1件の日報に含まれる複数棟のお客様対応を、棟ごとの配列に分解する
function parseCustomers(r) {
  const rooms = splitComma(r['お客様棟']);
  const ages = splitComma(r['年代']);
  const types = splitComma(r['属性']);
  const convs = splitLinesStr(r['会話・印象']);
  const sats = splitComma(r['推定満足度']);
  return rooms.map((room, i) => ({
    date: workDateStr(r),
    staff: r['担当者'] || '',
    room,
    age: ages[i] || '',
    type: types[i] || '',
    conversation: convs[i] || '',
    satisfaction: sats[i] || ''
  }));
}

// 同一スタッフ・同一勤務日・同一シフトの重複送信は、最新のものだけを残す
function dedupeReports(list) {
  const map = new Map();
  list.forEach(r => {
    const key = `${r['担当者']}|${workDateStr(r)}|${r['シフト']}`;
    const existing = map.get(key);
    if (!existing || parseSentAt(r) > parseSentAt(existing)) {
      map.set(key, r);
    }
  });
  return Array.from(map.values());
}

function render(reports, activeFilter) {
  activeFilter = activeFilter || {};
  const extraCountOf = r => (r.extraTasks || []).filter(x => x.type || x.content).length;

  // 担当者が選択されている時は、全体の概要（TOP画面）を隠して個人詳細だけを表示する
  document.getElementById("overview-area").style.display = activeFilter.staff ? "none" : "";

  document.getElementById("st-count").textContent = reports.length;
  const avgRate = reports.length ? Math.round(reports.reduce((a, r) => a + rateNum(r), 0) / reports.length) : 0;
  document.getElementById("st-avg").textContent = avgRate + "%";
  const staffSet = new Set(reports.map(r => r['担当者']));
  document.getElementById("st-staff").textContent = staffSet.size;

  // 担当者別サマリー（行クリックでその担当者に絞り込み）
  const byStaff = {};
  reports.forEach(r => {
    const name = r['担当者'] || '(不明)';
    if (!byStaff[name]) byStaff[name] = { count: 0, sum: 0 };
    byStaff[name].count++;
    byStaff[name].sum += rateNum(r);
  });
  const staffRows = Object.entries(byStaff)
    .map(([name, d]) => ({ name, count: d.count, avg: Math.round(d.sum / d.count) }))
    .sort((a, b) => b.avg - a.avg);

  document.getElementById("staff-table").innerHTML = staffRows.length ? `
    <table><thead><tr><th>担当者</th><th>日報件数</th><th>平均完了率</th></tr></thead><tbody>
    ${staffRows.map(s => `
      <tr class="staff-row-item" onclick="selectStaff('${s.name.replace(/'/g, "\\'")}')">
        <td>${s.name}</td>
        <td>${s.count}件</td>
        <td><span class="rate-bar-bg"><span class="rate-bar-fill" style="width:${s.avg}%"></span></span>${s.avg}%</td>
      </tr>`).join("")}
    </tbody></table>` : '<div class="empty">この日の日報はまだありません</div>';

  // 個人詳細（担当者を選択している時だけ表示：全期間の集計＋カレンダーで日を選択）
  const dateVal = document.getElementById("f-date").value;
  if (activeFilter.staff) {
    const staffReports = allReports.filter(r => r['担当者'] === activeFilter.staff);
    const byDate = {};
    staffReports.forEach(r => {
      const d = workDateStr(r);
      if (!byDate[d]) byDate[d] = { count: 0, sum: 0, extra: 0, talk: 0 };
      byDate[d].count++;
      byDate[d].sum += rateNum(r);
      byDate[d].extra += extraCountOf(r);
      byDate[d].talk += parseCustomers(r).length;
    });
    Object.values(byDate).forEach(v => { v.avg = Math.round(v.sum / v.count); });
    const totalExtra = staffReports.reduce((a, r) => a + extraCountOf(r), 0);
    const staffAvg = staffReports.length ? Math.round(staffReports.reduce((a, r) => a + rateNum(r), 0) / staffReports.length) : 0;

    if (!calMonth) {
      const dates = Object.keys(byDate).sort();
      const latest = dates.length ? dates[dates.length - 1] : getDefaultDate();
      const [y, m] = latest.split('-').map(Number);
      calMonth = { year: y, month: m - 1 };
    }

    const selectedDate = dateVal || null;

    document.getElementById("personal-detail").innerHTML = `
      <div class="card">
        <h2>${activeFilter.staff} さんの詳細</h2>
        <div class="stat-grid" style="margin-bottom:14px;">
          <div class="stat"><div class="stat-n">${staffReports.length}</div><div class="stat-l">日報件数（全期間）</div></div>
          <div class="stat"><div class="stat-n">${staffAvg}%</div><div class="stat-l">平均完了率（全期間）</div></div>
          <div class="stat"><div class="stat-n">${totalExtra}</div><div class="stat-l">通常業務以外 件数（全期間）</div></div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:10px;">緑色の日は日報があります。日付をクリックすると、下の「お客様対応ログ」「通常業務以外」「日報一覧」がその日だけに絞り込まれます</div>
        ${buildCalendarHtml(byDate, selectedDate)}
        <div style="margin-top:10px;">
          ${selectedDate ? `<span class="clear-staff-btn" onclick="clearDay()">${selectedDate} の絞り込みを解除</span>` : ''}
          <span class="clear-staff-btn" onclick="document.getElementById('f-staff').value='';applyFilter();">「${activeFilter.staff}」の絞り込みを解除</span>
        </div>
      </div>`;
  } else {
    calMonth = null;
    document.getElementById("personal-detail").innerHTML = '';
  }

  // お客様対応ログ（棟ごとに1行）
  let custRows = [];
  reports.forEach(r => { custRows = custRows.concat(parseCustomers(r)); });
  custRows.sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("customer-table").innerHTML = custRows.length ? `
    <table><thead><tr><th>勤務日</th><th>担当者</th><th>棟</th><th>年代/属性</th><th>会話・印象</th><th>満足度</th></tr></thead><tbody>
    ${custRows.map(c => `
      <tr>
        <td>${c.date}</td>
        <td>${c.staff}</td>
        <td><span class="tag">${c.room}</span></td>
        <td>${[c.age, c.type].filter(Boolean).join(" / ") || "-"}</td>
        <td class="conv-cell">${String(c.conversation || "-").replace(/\n/g, "<br>")}</td>
        <td>${c.satisfaction || "-"}</td>
      </tr>`).join("")}
    </tbody></table>` : '<div class="empty">対応ログがありません</div>';

  // 通常業務以外の業務ログ（施設改善・任務タスク・その他）
  const extraRows = [];
  reports.forEach(r => {
    (r.extraTasks || []).forEach(x => {
      if (x.type || x.content) {
        extraRows.push({
          date: workDateStr(r),
          staff: r['担当者'] || '',
          shift: r['シフト'] || '',
          type: x.type,
          content: x.content,
          duration: x.duration,
          reason: x.reason
        });
      }
    });
  });
  extraRows.sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("extra-table").innerHTML = extraRows.length ? `
    <table><thead><tr><th>勤務日</th><th>担当者</th><th>シフト</th><th>種別</th><th>内容</th><th>所要時間</th><th>理由</th></tr></thead><tbody>
    ${extraRows.map(x => `
      <tr>
        <td>${x.date}</td>
        <td>${x.staff}</td>
        <td><span class="tag">${formatShift(x.shift)}</span></td>
        <td>${x.type || '-'}</td>
        <td class="conv-cell">${String(x.content || '-').replace(/\n/g, "<br>")}</td>
        <td>${x.duration || '-'}</td>
        <td class="conv-cell">${String(x.reason || '-').replace(/\n/g, "<br>")}</td>
      </tr>`).join("")}
    </tbody></table>` : '<div class="empty">記録がありません</div>';

  // 日報一覧
  const sorted = reports.slice().sort((a, b) => workDateStr(b).localeCompare(workDateStr(a)));
  document.getElementById("report-table").innerHTML = sorted.length ? `
    <table><thead><tr><th>勤務日</th><th>担当者</th><th>シフト</th><th>完了率</th><th>連絡事項</th></tr></thead><tbody>
    ${sorted.map(r => `
      <tr>
        <td>${workDateStr(r)}（${r['曜日'] || ''}）</td>
        <td>${r['担当者'] || ''}</td>
        <td><span class="tag">${formatShift(r['シフト'])}</span></td>
        <td>${r['チェック完了数']}/${r['チェック全体数']}（${formatRate(r)}）</td>
        <td class="conv-cell">${String(r['その他連絡事項'] || "-").replace(/\n/g, "<br>")}</td>
      </tr>`).join("")}
    </tbody></table>` : '<div class="empty">日報がありません</div>';
}
</script>
</body>
</html>
