<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TOTONOI清掃ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%B9</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
--bg:#EAEFE3;--surface:#FFFFFF;--surface-2:#F4F6ED;--border:#D6DCC5;
--ink:#1E2A1C;--ink-muted:#5B6551;--ink-faint:#8A927C;
--accent:#2F5B44;--accent-strong:#234A36;--accent-ink:#FBFCF8;--accent-soft:#E1EADD;
--overdue-bg:#F5E1DA;--overdue-fg:#8F3A26;--overdue-ring:#DDA88F;
--due-bg:#F6E7C4;--due-fg:#7A5710;--due-ring:#D9BC72;
--sched-bg:#E4E9E4;--sched-fg:#4C5A50;--sched-ring:#C4CDC0;
--manual-bg:#E9E6D9;--manual-fg:#69624C;--manual-ring:#CFC7AC;
--unlogged-bg:#E3E8EF;--unlogged-fg:#3E5470;--unlogged-ring:#B9C6DA;
--partial-bg:#D9EAF2;--partial-fg:#215D77;--partial-ring:#A9CFE0;
--complete-bg:#F6DCC0;--complete-fg:#8A4413;--complete-ring:#E3AD79;
--warn-fg:#8F3A26;
--shadow:0 1px 2px rgba(24,30,20,.06),0 6px 18px rgba(24,30,20,.06);
--radius:16px;--radius-sm:10px;
--font-display:'Fraunces',Georgia,serif;
--font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme='light']){
--bg:#12160F;--surface:#191F15;--surface-2:#1F261A;--border:#323B29;
--ink:#E9EDE1;--ink-muted:#AAB39C;--ink-faint:#7B846E;
--accent:#7FBF9B;--accent-strong:#9BD3B3;--accent-ink:#0E1710;--accent-soft:#243329;
--overdue-bg:#3A241E;--overdue-fg:#F0B7A2;--overdue-ring:#6B3F30;
--due-bg:#3A3018;--due-fg:#EAD08D;--due-ring:#6B5726;
--sched-bg:#252B24;--sched-fg:#B9C2B0;--sched-ring:#3D473A;
--manual-bg:#2A2820;--manual-fg:#C9C1A4;--manual-ring:#48432F;
--unlogged-bg:#212B38;--unlogged-fg:#A9C0DD;--unlogged-ring:#3A4C63;
--partial-bg:#1B2E38;--partial-fg:#8FC7E0;--partial-ring:#2F4E5E;
--complete-bg:#3D2A18;--complete-fg:#F0B978;--complete-ring:#6B4A26;
--warn-fg:#F0B7A2;
--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme='dark']{
--bg:#12160F;--surface:#191F15;--surface-2:#1F261A;--border:#323B29;
--ink:#E9EDE1;--ink-muted:#AAB39C;--ink-faint:#7B846E;
--accent:#7FBF9B;--accent-strong:#9BD3B3;--accent-ink:#0E1710;--accent-soft:#243329;
--overdue-bg:#3A241E;--overdue-fg:#F0B7A2;--overdue-ring:#6B3F30;
--due-bg:#3A3018;--due-fg:#EAD08D;--due-ring:#6B5726;
--sched-bg:#252B24;--sched-fg:#B9C2B0;--sched-ring:#3D473A;
--manual-bg:#2A2820;--manual-fg:#C9C1A4;--manual-ring:#48432F;
--unlogged-bg:#212B38;--unlogged-fg:#A9C0DD;--unlogged-ring:#3A4C63;
--partial-bg:#1B2E38;--partial-fg:#8FC7E0;--partial-ring:#2F4E5E;
--complete-bg:#3D2A18;--complete-fg:#F0B978;--complete-ring:#6B4A26;
--warn-fg:#F0B7A2;
--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;
-webkit-text-size-adjust:100%;min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;
border-bottom:1px solid var(--border);}
.topbar-inner{max-width:640px;margin:0 auto;padding:0 16px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-faint);
text-transform:uppercase;margin:0 0 2px;}
.h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;
text-wrap:balance;color:var(--ink);}
.topbar-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
margin-bottom:10px;}
.icon-btn{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:1px solid var(--border);
background:var(--surface);color:var(--ink-muted);font-size:16px;cursor:pointer;display:flex;
align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.summary-row{display:flex;gap:8px;flex-wrap:wrap;}
.sumchip{display:flex;align-items:baseline;gap:6px;background:var(--surface);
border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;
color:var(--ink-muted);}
.sumchip b{font-family:var(--font-mono);font-size:14px;color:var(--ink);font-weight:600;
font-variant-numeric:tabular-nums;}
.sumchip.od b{color:var(--overdue-fg);} .sumchip.du b{color:var(--due-fg);}
.sumchip.ul b{color:var(--unlogged-fg);} .sumchip.ok b{color:var(--sched-fg);}
.sync-line{margin:8px 2px 0;font-size:11px;font-family:var(--font-mono);color:var(--ink-faint);}
.sync-line .sync-warn{color:var(--warn-fg);}
.tabbar{display:flex;gap:4px;margin:12px 0 2px;background:var(--surface-2);border:1px solid var(--border);
border-radius:999px;padding:3px;}
.tab-btn{flex:1 1 0;border:none;background:transparent;color:var(--ink-muted);font-size:12.5px;
font-weight:600;padding:8px 6px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:var(--accent-ink);}
.tab-btn:hover:not(.active){color:var(--ink);}
section.group{margin-top:28px;scroll-margin-top:140px;}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.group-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);}
.group-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
padding:14px 16px 12px;}
.card-name{font-size:15.5px;font-weight:600;color:var(--ink);margin:0 0 3px;}
.card-freq{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;}
.chip.overdue{background:var(--overdue-bg);color:var(--overdue-fg);border-color:var(--overdue-ring);}
.chip.due{background:var(--due-bg);color:var(--due-fg);border-color:var(--due-ring);}
.chip.scheduled{background:var(--sched-bg);color:var(--sched-fg);border-color:var(--sched-ring);}
.chip.manual{background:var(--manual-bg);color:var(--manual-fg);border-color:var(--manual-ring);}
.chip.unlogged{background:var(--unlogged-bg);color:var(--unlogged-fg);border-color:var(--unlogged-ring);}
.comp-tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 7px;
border-radius:999px;border:1px solid transparent;white-space:nowrap;}
.comp-tag.partial{background:var(--partial-bg);color:var(--partial-fg);border-color:var(--partial-ring);}
.comp-tag.complete{background:var(--complete-bg);color:var(--complete-fg);border-color:var(--complete-ring);}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto;}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 12px;font-size:12.5px;
color:var(--ink-muted);}
.card-meta span b{color:var(--ink);font-weight:600;font-family:var(--font-mono);
font-variant-numeric:tabular-nums;}
.card-note{margin:0 16px 12px;font-size:12.5px;color:var(--ink-muted);background:var(--surface-2);
border-radius:var(--radius-sm);padding:8px 10px;}
.card-actions{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap;}
button.btn{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
border:1px solid var(--border);background:var(--surface);color:var(--ink);}
button.btn:hover{border-color:var(--accent);color:var(--accent);}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
button.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink);}
button.btn.partial{background:var(--partial-bg);border-color:var(--partial-ring);color:var(--partial-fg);}
button.btn.partial:hover{border-color:var(--partial-fg);}
button.btn.complete{background:var(--complete-bg);border-color:var(--complete-ring);color:var(--complete-fg);}
button.btn.complete:hover{border-color:var(--complete-fg);}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
details.proc{border-top:1px solid var(--border);}
details.proc>summary{list-style:none;cursor:pointer;padding:10px 16px;font-size:12.5px;
color:var(--ink-muted);display:flex;align-items:center;gap:6px;user-select:none;}
details.proc>summary::-webkit-details-marker{display:none;}
details.proc>summary::before{content:'\2304';display:inline-block;transition:transform .15s;
font-size:14px;}
details.proc[open]>summary::before{transform:rotate(180deg);}
details.proc[open]>summary{border-bottom:1px solid var(--border);}
.proc-body{padding:12px 16px 16px;font-size:13px;color:var(--ink);background:var(--surface-2);}
.proc-body h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
color:var(--ink-faint);font-weight:600;}
.proc-list{margin:0 0 14px;padding-left:18px;}
.proc-list li{margin-bottom:5px;}
.proc-empty{color:var(--ink-faint);font-style:italic;margin:0 0 14px;}
.hist-list{list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:12px;
color:var(--ink-muted);}
.hist-list li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--border);}
.hist-list li:last-child{border-bottom:none;}
.hist-list b{color:var(--ink);font-weight:600;}
.ref{font-size:11.5px;color:var(--ink-faint);margin-top:10px;}
dialog{border:none;border-radius:var(--radius);padding:0;background:var(--surface);
color:var(--ink);box-shadow:var(--shadow);max-width:420px;width:calc(100vw - 48px);}
dialog::backdrop{background:rgba(20,24,16,.45);}
.dlg-body{padding:20px;}
.dlg-title{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 4px;}
.dlg-sub{font-size:12.5px;color:var(--ink-muted);margin:0 0 16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:5px;
font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:var(--radius-sm);
border:1px solid var(--border);background:var(--bg);color:var(--ink);font-family:var(--font-body);
font-size:14px;}
.field input[type=date]{font-family:var(--font-mono);}
.field textarea{resize:vertical;min-height:56px;font-family:var(--font-body);}
.dlg-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:6px;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);
color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);
z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.foot{margin-top:40px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
button.btn.sm{padding:6px 11px;font-size:12px;}
#today-tab{margin-top:18px;}
.task-group{margin-bottom:22px;}
.task-group:last-child{margin-bottom:0;}
.task-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
margin-bottom:8px;padding:0 2px;font-family:var(--font-display);font-size:15px;font-weight:600;
color:var(--ink);}
.task-group-count{font-family:var(--font-mono);font-size:11.5px;font-weight:400;color:var(--ink-faint);}
.task-card{display:flex;align-items:center;justify-content:space-between;gap:12px;
background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);
border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;}
.task-card.overdue{border-left-color:var(--overdue-ring);}
.task-card.due{border-left-color:var(--due-ring);}
.task-card.unlogged{border-left-color:var(--unlogged-ring);}
.task-card-main{min-width:0;flex:1 1 auto;}
.task-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.task-card-name{font-size:14.5px;font-weight:600;color:var(--ink);}
.task-card-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
.task-card-last{font-size:12px;color:var(--ink-muted);margin-top:4px;}
.task-card-last b{color:var(--ink);font-weight:600;}
.task-card .btn.primary{flex:0 0 auto;padding:9px 16px;}
.empty-state{text-align:center;padding:48px 16px;margin-top:12px;background:var(--surface);
border:1px solid var(--border);border-radius:var(--radius);}
.empty-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink);margin:0 0 6px;}
.empty-sub{font-size:13px;color:var(--ink-muted);margin:0;}
#calendar-tab{margin-top:18px;}
#all-tab{margin-top:18px;}
#all-tab section.group{margin-top:0;margin-bottom:26px;}
#all-tab section.group:last-child{margin-bottom:0;}
.cal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
box-shadow:var(--shadow);padding:14px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-label{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-faint);padding:2px 0 6px;}
.cal-cell{position:relative;aspect-ratio:1/1;border:1px solid var(--border);border-radius:10px;
background:var(--surface-2);color:var(--ink);font-family:var(--font-mono);font-size:12.5px;
cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px;}
.cal-cell:hover{border-color:var(--accent);}
.cal-cell.empty{border-color:transparent;background:transparent;cursor:default;}
.cal-cell.today{border-color:var(--accent);border-width:2px;font-weight:700;}
.cal-dot{position:absolute;bottom:4px;font-size:10px;font-weight:700;border-radius:999px;
min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.cal-dot.partial{left:4px;background:var(--partial-fg);color:var(--surface);}
.cal-dot.complete{right:4px;background:var(--complete-fg);color:var(--surface);}
.target-list{display:flex;flex-direction:column;}
.target-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
padding:9px 12px;cursor:pointer;font-family:inherit;color:var(--ink);margin-bottom:6px;}
.target-row:last-child{margin-bottom:0;}
.target-row:hover{border-color:var(--accent);}
.target-name{font-size:13px;font-weight:600;color:var(--ink);flex:0 0 auto;}
.target-dates{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0;}
.target-date{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;
border:1px solid transparent;}
.target-date.partial{background:var(--partial-bg);color:var(--partial-fg);border-color:var(--partial-ring);}
.target-date.complete{background:var(--complete-bg);color:var(--complete-fg);border-color:var(--complete-ring);}
.target-date-empty{font-size:11px;color:var(--ink-faint);font-style:italic;}
.target-empty{padding:14px 2px;color:var(--ink-faint);font-size:13px;}
.day-rec-list{list-style:none;margin:0 0 12px;padding:0;font-size:13px;}
.day-rec-list li{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;padding:6px 0;
border-bottom:1px dashed var(--border);}
.day-rec-list li:last-child{border-bottom:none;}
.day-rec-list span{color:var(--ink-muted);font-size:12px;flex:1 1 auto;}
button.day-del{background:none;border:none;color:var(--overdue-fg);font-size:12px;cursor:pointer;
padding:2px 4px;text-decoration:underline;}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
